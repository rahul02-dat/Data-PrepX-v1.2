name: dataprepx

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dataprepx
      POSTGRES_PASSWORD: dataprepx
      POSTGRES_DB: dataprepx
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataprepx"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"

  migrate:
    image: migrate/migrate:v4.17.1
    volumes:
      - ./infra/postgres/migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://dataprepx:dataprepx@postgres:5432/dataprepx?sslmode=disable
      - up
    profiles: ["tools"]

  gateway-go:
    build:
      context: ./services/gateway-go
    environment:
      GATEWAY_ADDR: ":8080"
      ML_ENGINE_URL: "http://ml-engine-py:8000"
      AGENT_ORCHESTRATOR_URL: "http://agent-orchestrator:8001"
      DATABASE_URL: "postgres://dataprepx:dataprepx@postgres:5432/dataprepx?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ml-engine-py:
    build:
      context: ./services/ml-engine-py
    environment:
      DATABASE_URL: "postgres://dataprepx:dataprepx@postgres:5432/dataprepx?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  agent-orchestrator:
    build:
      context: ./services/agent-orchestrator
    environment:
      OLLAMA_URL: "http://ollama:11434"
      ML_ENGINE_URL: "http://ml-engine-py:8000"
      SUMMARIZER_OLLAMA_MODEL: "llama3.1:8b-instruct-q4_K_M"
    ports:
      - "8001:8001"
    depends_on:
      - ollama
      - ml-engine-py

  frontend-react:
    build:
      context: ./services/frontend-react
    environment:
      VITE_GATEWAY_URL: "http://localhost:8080"
    ports:
      - "4173:4173"
    depends_on:
      - gateway-go

  worker-celery:
    build:
      context: ./services/ml-engine-py
    command: >
      celery -A app.workers worker
      --loglevel=info
      -Q default,gates,preprocessing,estimation,summarization
      --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
    environment:
      DATABASE_URL: "postgres://dataprepx:dataprepx@postgres:5432/dataprepx?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      AGENT_ORCHESTRATOR_URL: "http://agent-orchestrator:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  ollama-data: