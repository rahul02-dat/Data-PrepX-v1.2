[project]
name = "dataprepx-agent-orchestrator"
version = "0.0.1"
description = "Bounded RAG summarizer service (LangGraph + Ollama). Real graph wiring lands in Phase 7 per docs/01_IMPLEMENTATION_PLANNER.md."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "black>=24.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.setuptools]
py-modules = ["app"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
