[project]
name = "dataprepx-ml-engine"
version = "0.0.1"
description = "DataPrepX v2 ML engine: pipeline core (gates, lineage, imputation, RL, MAML, HPO, stacking) and Celery tasks."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "black==24.8.0",
    "jsonschema>=4.21",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
markers = [
    "db: requires a live Postgres reachable via DATABASE_URL (excluded from default `pytest` run)",
]
addopts = "-m 'not db'"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"