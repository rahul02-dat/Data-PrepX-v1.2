max_null_rate_gate:
  enabled: true
  threshold: 0.4
  per_column: true

schema_conformance_gate:
  enabled: true
  allow_extra_columns: false
  strict_dtypes: true

drift_gate:
  enabled: true
  method: psi
  psi_threshold: 0.25
  ks_p_value_threshold: 0.05
  psi_bins: 10

imputation:
  enabled: true
  method: mice
  mice_max_iter: 25
  mice_tol: 0.01
  knn_n_neighbors: 5
  categorical_strategy: most_frequent

outlier_detection:
  enabled: true
  method: isolation_forest
  contamination: 0.05
  n_estimators: 100
  lof_n_neighbors: 20

estimation:
  enabled: true
  n_trials: 30
  cv_folds: 5
  n_startup_trials: 5
  n_warmup_steps: 5
  tree_model_families: [xgboost, lightgbm, random_forest]
  include_linear_family: true
  stacking_cv_folds: 5

rl_optimizer:
  alpha: 0.1
  gamma: 0.9
  epsilon: 0.3
  epsilon_decay: 0.98
  min_epsilon: 0.01
  reward_mode: full_stack
