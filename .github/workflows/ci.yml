name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gateway-go:
    name: gateway-go (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt found unformatted files:"
            echo "$fmt_out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./... -v

  ml-engine-py:
    name: ml-engine-py (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ml-engine-py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: ruff
        run: ruff check .
      - name: black --check
        run: black --check .
      - name: pytest
        run: pytest -v

  agent-orchestrator:
    name: agent-orchestrator (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agent-orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: ruff
        run: ruff check .
      - name: black --check
        run: black --check .
      - name: pytest
        run: pytest -v

  frontend-react:
    name: frontend-react (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npx tsc -b
      - name: Test
        run: npx vitest run

  contracts:
    name: job contract validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: pytest
        run: pytest -v

  migrations:
    name: apply migrations against real Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dataprepx
          POSTGRES_PASSWORD: dataprepx
          POSTGRES_DB: dataprepx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataprepx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run migrate up
        run: |
          docker run --rm --network=host \
            -v ${{ github.workspace }}/infra/postgres/migrations:/migrations \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database=postgres://dataprepx:dataprepx@localhost:5432/dataprepx?sslmode=disable \
            up
      - name: Verify expected tables exist
        run: |
          docker run --rm --network=host postgres:16-alpine \
            psql postgres://dataprepx:dataprepx@localhost:5432/dataprepx -c '\dt' | tee /tmp/tables.txt
          for t in datasets runs pipeline_steps transformations hyperparameters metrics artifacts audit_log gate_evaluations; do
            grep -q "$t" /tmp/tables.txt || (echo "missing table: $t" && exit 1)
          done
      - name: Verify Phase 2 lineage columns exist
        run: |
          docker run --rm --network=host postgres:16-alpine \
            psql postgres://dataprepx:dataprepx@localhost:5432/dataprepx -c '\d runs' | tee /tmp/runs_cols.txt
          grep -q "run_key" /tmp/runs_cols.txt || (echo "missing column: runs.run_key" && exit 1)
          docker run --rm --network=host postgres:16-alpine \
            psql postgres://dataprepx:dataprepx@localhost:5432/dataprepx -c '\d datasets' | tee /tmp/datasets_cols.txt
          grep -q "reference_dataset_id" /tmp/datasets_cols.txt || (echo "missing column: datasets.reference_dataset_id" && exit 1)
      - name: Run migrate down and confirm clean reversal
        run: |
          docker run --rm --network=host \
            -v ${{ github.workspace }}/infra/postgres/migrations:/migrations \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database=postgres://dataprepx:dataprepx@localhost:5432/dataprepx?sslmode=disable \
            down -all

  ml-engine-py-db-integration:
    name: ml-engine-py (lineage integration, real Postgres)
    runs-on: ubuntu-latest
    needs: migrations
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dataprepx
          POSTGRES_PASSWORD: dataprepx
          POSTGRES_DB: dataprepx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataprepx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/ml-engine-py
    env:
      DATABASE_URL: postgres://dataprepx:dataprepx@localhost:5432/dataprepx?sslmode=disable
      GATE_CONFIG_PATH: ${{ github.workspace }}/config/gates.yaml
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations
        run: |
          docker run --rm --network=host \
            -v ${{ github.workspace }}/infra/postgres/migrations:/migrations \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database=${{ env.DATABASE_URL }} \
            up
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: pytest (db-marked lineage tests only)
        run: pytest -v -m db

  compose-config:
    name: docker compose config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files parse
        run: |
          docker compose -f docker-compose.yml config > /dev/null
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config > /dev/null