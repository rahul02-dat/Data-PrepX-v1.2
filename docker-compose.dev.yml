services:
  gateway-go:
    build:
      context: ./services/gateway-go
      target: build
    volumes:
      - ./services/gateway-go:/src
    working_dir: /src
    command: ["go", "run", "./cmd/gateway"]

  ml-engine-py:
    volumes:
      - ./services/ml-engine-py/app:/app/app
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]

  agent-orchestrator:
    volumes:
      - ./services/agent-orchestrator/app.py:/app/app.py
    command:
      ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]

  frontend-react:
    build:
      context: ./services/frontend-react
    volumes:
      - ./services/frontend-react/src:/app/src
      - ./services/frontend-react/index.html:/app/index.html
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports:
      - "5173:5173"
